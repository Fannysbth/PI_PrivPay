# Condition `proposed` (ADR-0003): the whole privacy layer. Adds Privacy Service with its own PostgreSQL and hands its
# address to the four callers (N-47: PRIVACY_SERVICE_URL is required here and forbidden in baseline).
name: privpay-proposed

services:
  pg-privacy:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    user: postgres
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp', '/var/run/postgresql']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=50
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - log_statement=none
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_privacy_admin_password
      PRIVPAY_DB: privpay_privacy
      PRIVPAY_OWNER: privpay_privacy_owner
      PRIVPAY_APP: privpay_app
      PRIVPAY_AUDITOR: privpay_auditor
    volumes:
      - pgdata-privacy:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_privacy_admin_password, privpay_privacy_owner_password, privpay_app_password, privpay_auditor_password]
    networks: [privacy]

  migrate-privacy:
    image: privpay-privacy-service:dk01a
    build: &build-privacy
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/privacy-service', SERVICE_DIR: services/privacy-service }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp']
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, privacy]
    environment:
      TZ: UTC
      PRIVACY_MODE: proposed
      PG_HOST: pg-privacy
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
    secrets: [privpay_privacy_owner_password]
    networks: [privacy]
    depends_on: { pg-privacy: { condition: service_healthy } }

  privacy-service:
    image: privpay-privacy-service:dk01a
    build: *build-privacy
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://privacy-service:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    environment:
      TZ: UTC
      BIND_HOST: 0.0.0.0
      IDP_URL: http://idp:4000
      PRIVACY_MODE: proposed
      PORT: '4001'
      PG_HOST: pg-privacy
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      GRACE_PERIOD_SECONDS: '30'
      PSEUDONYM_KEY_VERSION: '1'
      TTL_PAYMENT_PROCESSING: '900'
      TTL_FRAUD_DETECTION: '2592000'
      TTL_NOTIFICATION: '900'
      TTL_NOTIFICATION_REGISTRATION: '31536000'
      TTL_DAILY_RECONCILIATION: '86400'
      TTL_INTERNAL_AUDIT: '600'
      DISCLOSURE_APPROVAL_TTL_SECONDS: '600'
      RETENTION_DAYS: '90'
      RETENTION_JOB_RUN_UTC: '01:00'
      PSEUDONYM_HMAC_SECRET_FILE: /run/secrets/pseudonym_hmac_secret
      BLIND_INDEX_SECRET_FILE: /run/secrets/blind_index_secret
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      # NFR-06: the identity path ends in TLS. The service name is the name on the certificate; its own health check
      # verifies the certificate like any caller does, with the dev CA as the only extra root.
      TLS_CERT_FILE: /run/secrets/tls_privacy_crt
      TLS_KEY_FILE: /run/secrets/tls_privacy_key
      NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca_crt
    secrets:
      [pseudonym_hmac_secret, blind_index_secret, field_encryption_key, privpay_app_password, privpay_auditor_password, tls_privacy_crt, tls_privacy_key, tls_ca_crt]
    networks: [privacy]
    depends_on:
      migrate-privacy: { condition: service_completed_successfully }
      idp: { condition: service_healthy }

  # The Privacy Service checks every JWT against the IdP's keys, so the IdP is on its network too.
  idp:
    environment: { PRIVACY_MODE: proposed }
    networks: [privacy]

  sms-simulator:
    environment: { PRIVACY_MODE: proposed }

  bank-simulator:
    environment: { PRIVACY_MODE: proposed }

  fraud-service:
    environment: { PRIVACY_MODE: proposed }

  migrate-transaction:
    environment: { PRIVACY_MODE: proposed }

  migrate-fraud:
    environment: { PRIVACY_MODE: proposed }

  migrate-notification:
    environment: { PRIVACY_MODE: proposed }

  migrate-reconciliation:
    environment: { PRIVACY_MODE: proposed }

  transaction-service:
    secrets: [tls_ca_crt]
    networks: [privacy]
    environment:
      PRIVACY_MODE: proposed
      PRIVACY_SERVICE_URL: https://privacy-service:4001
      NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca_crt
    depends_on: { privacy-service: { condition: service_healthy } }

  notification-service:
    secrets: [tls_ca_crt]
    networks: [privacy]
    environment:
      PRIVACY_MODE: proposed
      PRIVACY_SERVICE_URL: https://privacy-service:4001
      NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca_crt
    depends_on: { privacy-service: { condition: service_healthy } }

  reconciliation-service:
    secrets: [tls_ca_crt]
    networks: [privacy]
    environment:
      PRIVACY_MODE: proposed
      PRIVACY_SERVICE_URL: https://privacy-service:4001
      NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca_crt
    depends_on: { privacy-service: { condition: service_healthy } }

  gateway:
    secrets: [tls_ca_crt]
    networks: [privacy]
    environment:
      PRIVACY_MODE: proposed
      PRIVACY_SERVICE_URL: https://privacy-service:4001
      NODE_EXTRA_CA_CERTS: /run/secrets/tls_ca_crt
    depends_on: { privacy-service: { condition: service_healthy } }

  # DK-02a: the published edge. The host port is the one Postman and the earlier checks already use.
  kong:
    ports: ['127.0.0.1:${GATEWAY_HOST_PORT:-4010}:8443']

  smoke:
    environment: { PRIVACY_MODE: proposed }
