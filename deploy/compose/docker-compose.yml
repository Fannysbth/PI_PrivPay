# PrivPay, Docker Compose (DK-01a). This file holds everything the two conditions share; the condition itself is chosen by
# the second file: `-f docker-compose.yml -f mode.proposed.yml` or `-f docker-compose.yml -f mode.baseline.yml` (ADR-0003;
# `pnpm docker:up`). Without a mode file the services refuse to start (PRIVACY_MODE is required).
#
# - Services live on internal networks (edge / business / privacy, DK-03); only Kong (the edge, DK-02a) is published, and
#   only on the loopback of the host, over TLS. The gateway adapter is not published: Kong forwards to it, and /metrics of
#   the adapter is not offered on Kong's listener (N-05).
# - Same CPU and memory limits in both conditions, because the limits are written here once (Metodologi C.3).
# - Secrets are Docker secrets: files from secrets/docker/ (made by `pnpm docker:secrets`, git-ignored) mounted under
#   /run/secrets and named in <NAME>_FILE variables. No secret is in an image, an argument or an environment value.
# - Monitoring is only defined (docker-compose.monitoring.yml, profile `monitoring`); nothing starts it by default.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp']
  restart: unless-stopped

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 192M

x-node-health: &node-health
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s

x-pg: &pg
  image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
  user: postgres
  tmpfs: ['/tmp', '/var/run/postgresql']
  command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=50
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=16MB
    - -c
    - log_statement=none
  # TCP, not the socket: the temporary server of the first start only listens on the socket, so a socket check would pass
  # before the init script has made the roles.
  healthcheck:
    test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

# DK-04 (ADR-0017): Keycloak is the IdP of the stack. The dev IdP (`idp`, profile `dev-idp`) is for `pnpm dev:up` and fast tests.
x-idp-env: &idp-env
  IDP_URL: http://keycloak:8080
  IDP_KIND: keycloak
  IDP_REALM: privpay
  IDP_ISSUER: http://keycloak:8080/realms/privpay

x-node-env: &node-env
  <<: *idp-env
  TZ: UTC
  BIND_HOST: 0.0.0.0

# Three zones (NFR-06, DK-03). `edge` is the only network with a way out and carries only Kong, the one published
# service (and Grafana, which exists only under the monitoring profile). `business` holds the services that see tokens and their databases. `privacy` holds the Privacy Service, its
# database and the services that may call it. A network marked internal has no route to the outside and no published port.
networks:
  edge: {}
  business:
    internal: true
  privacy:
    internal: true

secrets:
  pseudonym_hmac_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pseudonym_hmac_secret' }
  blind_index_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/blind_index_secret' }
  field_encryption_key: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/field_encryption_key' }
  api-gateway_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/api-gateway_client_secret' }
  transaction_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/transaction_client_secret' }
  fraud_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/fraud_client_secret' }
  notification_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/notification_client_secret' }
  reconciliation_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/reconciliation_client_secret' }
  privpay_privacy_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_privacy_owner_password' }
  privpay_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_app_password' }
  privpay_auditor_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_auditor_password' }
  privpay_transaction_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_transaction_owner_password' }
  privpay_transaction_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_transaction_app_password' }
  privpay_fraud_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_fraud_owner_password' }
  privpay_fraud_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_fraud_app_password' }
  privpay_notification_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_notification_owner_password' }
  privpay_notification_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_notification_app_password' }
  privpay_reconciliation_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_reconciliation_owner_password' }
  privpay_reconciliation_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_reconciliation_app_password' }
  pg_privacy_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_privacy_admin_password' }
  pg_transaction_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_transaction_admin_password' }
  pg_fraud_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_fraud_admin_password' }
  pg_notification_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_notification_admin_password' }
  pg_reconciliation_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_reconciliation_admin_password' }
  tls_ca_crt: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/tls_ca.crt' }
  tls_privacy_crt: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/tls_privacy.crt' }
  tls_privacy_key: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/tls_privacy.key' }
  tls_kong_crt: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/tls_kong.crt' }
  tls_kong_key: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/tls_kong.key' }
  idp-admin_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/idp-admin_client_secret' }
  keycloak_password_customer: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/keycloak_password_customer' }
  keycloak_password_admin: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/keycloak_password_admin' }
  keycloak_password_auditor: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/keycloak_password_auditor' }
  keycloak_password_analyst: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/keycloak_password_analyst' }
  keycloak_password_bank: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/keycloak_password_bank' }
  admin-console_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/admin-console_client_secret' }
  edge_adapter_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/edge_adapter_secret' }
  grafana_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/grafana_admin_password' }

volumes:
  idp-state: {}
  keycloak-import: {}
  kong-config: {}
  pgdata-privacy: {}
  pgdata-transaction: {}
  pgdata-fraud: {}
  pgdata-notification: {}
  pgdata-reconciliation: {}

services:
  # ---- PostgreSQL 16, one instance per service (invariant 4). pg-privacy is added by mode.proposed.yml. ----
  pg-transaction:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_transaction_admin_password
      PRIVPAY_DB: privpay_transaction
      PRIVPAY_OWNER: privpay_transaction_owner
      PRIVPAY_APP: privpay_transaction_app
    volumes:
      - pgdata-transaction:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_transaction_admin_password, privpay_transaction_owner_password, privpay_transaction_app_password]
    networks: [business]

  pg-fraud:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_fraud_admin_password
      PRIVPAY_DB: privpay_fraud
      PRIVPAY_OWNER: privpay_fraud_owner
      PRIVPAY_APP: privpay_fraud_app
    volumes:
      - pgdata-fraud:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_fraud_admin_password, privpay_fraud_owner_password, privpay_fraud_app_password]
    networks: [business]

  pg-notification:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_notification_admin_password
      PRIVPAY_DB: privpay_notification
      PRIVPAY_OWNER: privpay_notification_owner
      PRIVPAY_APP: privpay_notification_app
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_notification_admin_password, privpay_notification_owner_password, privpay_notification_app_password]
    networks: [business]

  pg-reconciliation:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_reconciliation_admin_password
      PRIVPAY_DB: privpay_reconciliation
      PRIVPAY_OWNER: privpay_reconciliation_owner
      PRIVPAY_APP: privpay_reconciliation_app
    volumes:
      - pgdata-reconciliation:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_reconciliation_admin_password, privpay_reconciliation_owner_password, privpay_reconciliation_app_password]
    networks: [business]

  # ---- Migrations, run once per database by its schema owner (the runtime role never sees the owner password). ----
  migrate-transaction:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-transaction-service:dk01a
    build: &build-transaction
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/transaction-service', SERVICE_DIR: services/transaction-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, transaction]
    environment: { TZ: UTC, PG_HOST: pg-transaction, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_transaction_owner_password]
    networks: [business]
    depends_on: { pg-transaction: { condition: service_healthy } }

  migrate-fraud:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-fraud-service:dk01a
    build: &build-fraud
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/fraud-service', SERVICE_DIR: services/fraud-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, fraud]
    environment: { TZ: UTC, PG_HOST: pg-fraud, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_fraud_owner_password]
    networks: [business]
    depends_on: { pg-fraud: { condition: service_healthy } }

  migrate-notification:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-notification-service:dk01a
    build: &build-notification
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/notification-service', SERVICE_DIR: services/notification-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, notification]
    environment: { TZ: UTC, PG_HOST: pg-notification, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_notification_owner_password]
    networks: [business]
    depends_on: { pg-notification: { condition: service_healthy } }

  migrate-reconciliation:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-reconciliation-service:dk01a
    build: &build-reconciliation
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/reconciliation-service', SERVICE_DIR: services/reconciliation-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, reconciliation]
    environment: { TZ: UTC, PG_HOST: pg-reconciliation, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_reconciliation_owner_password]
    networks: [business]
    depends_on: { pg-reconciliation: { condition: service_healthy } }

  # ---- The dev IdP (ADR-0004): only with `--profile dev-idp`; Keycloak is the IdP of the stack (DK-04). Internal only. ----
  # The services are configured for Keycloak; to run the stack on the dev IdP, set IDP_URL, IDP_KIND=dev-idp and IDP_ISSUER yourself.
  idp:
    profiles: [dev-idp]
    <<: [*hardening, *limits, *node-health]
    image: privpay-idp:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/dev-idp', SERVICE_DIR: tools/dev-idp }
    environment:
      <<: *node-env
      PORT: '4000'
      NODE_ENV: development
      DEV_IDP_ENABLED: 'true'
      DEV_IDP_SECRETS_DIR: /run/secrets
      DEV_IDP_STATE_DIR: /state
      # DK-02a: shortened only for the edge-check of an expired token (docker:edge-check ... limits); 300 otherwise (ADR-0007).
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-300}
    volumes: ['idp-state:/state']
    secrets: [api-gateway_client_secret, transaction_client_secret, fraud_client_secret, notification_client_secret, reconciliation_client_secret]
    networks: [business]

  # ---- Business services ----
  transaction-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-transaction-service:dk01a
    build: *build-transaction
    environment:
      <<: *node-env
      PORT: '4002'
      PG_HOST: pg-transaction
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      FRAUD_AMOUNT_THRESHOLD: '1000000'
      TX_PENDING_TIMEOUT_SECONDS: '300'
      TX_SWEEP_INTERVAL_SECONDS: '30'
      FRAUD_SERVICE_URL: http://fraud-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      TRANSACTION_CLIENT_SECRET_FILE: /run/secrets/transaction_client_secret
    secrets: [privpay_transaction_app_password, transaction_client_secret]
    networks: [business]
    depends_on:
      migrate-transaction: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  fraud-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-fraud-service:dk01a
    build: *build-fraud
    environment:
      <<: *node-env
      PORT: '4003'
      PG_HOST: pg-fraud
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      FRAUD_AMOUNT_THRESHOLD: '1000000'
      FRAUD_ODD_HOUR_START: '22'
      FRAUD_ODD_HOUR_END: '6'
      FRAUD_HOLD_THRESHOLD: '50'
      FRAUD_BLOCK_THRESHOLD: '90'
      FRAUD_HISTORY_DAYS: '30'
    secrets: [privpay_fraud_app_password]
    networks: [business]
    depends_on:
      migrate-fraud: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  notification-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-notification-service:dk01a
    build: *build-notification
    environment:
      <<: *node-env
      PORT: '4004'
      PG_HOST: pg-notification
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      SMS_SIMULATOR_URL: http://sms-simulator:4007
      NOTIFICATION_CLIENT_SECRET_FILE: /run/secrets/notification_client_secret
    secrets: [privpay_notification_app_password, notification_client_secret]
    networks: [business]
    depends_on:
      migrate-notification: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  reconciliation-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-reconciliation-service:dk01a
    build: *build-reconciliation
    environment:
      <<: *node-env
      PORT: '4005'
      PG_HOST: pg-reconciliation
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      RECON_DAILY_RUN_UTC: '00:10'
      TRANSACTION_SERVICE_URL: http://transaction-service:4002
      RECONCILIATION_CLIENT_SECRET_FILE: /run/secrets/reconciliation_client_secret
    secrets: [privpay_reconciliation_app_password, reconciliation_client_secret]
    networks: [business]
    depends_on:
      migrate-reconciliation: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  # ---- Simulators ----
  sms-simulator:
    <<: [*hardening, *limits, *node-health]
    image: privpay-sms-simulator:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/sms-simulator', SERVICE_DIR: services/sms-simulator }
    environment:
      <<: *node-env
      PORT: '4007'
      SMS_SIMULATOR_TEST_ENDPOINTS: 'true'
    networks: [business]

  bank-simulator:
    <<: [*hardening, *limits, *node-health]
    image: privpay-bank-simulator:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/bank-simulator', SERVICE_DIR: services/bank-simulator }
    environment:
      <<: *node-env
      PORT: '4006'
      GATEWAY_URL: http://gateway:4010
      BANK_USERNAME: bank.uji.1
      # DK-04c: the bank simulator holds the password of the bank class and nothing else.
      BANK_PASSWORD_FILE: /run/secrets/keycloak_password_bank
      BANK_SIMULATOR_TEST_ENDPOINTS: 'true'
    secrets: [keycloak_password_bank]
    networks: [business]

  # ---- The gateway adapter: reached through Kong only, not published ----
  gateway:
    <<: [*hardening, *limits, *node-health]
    image: privpay-gateway:dk01a
    build: &build-gateway-image
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/gateway', SERVICE_DIR: services/gateway }
    environment:
      <<: *node-env
      PORT: '4010'
      TRANSACTION_SERVICE_URL: http://transaction-service:4002
      RECONCILIATION_SERVICE_URL: http://reconciliation-service:4005
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      API_GATEWAY_CLIENT_SECRET_FILE: /run/secrets/api-gateway_client_secret
      # ADR-0017 items 5 and 6: registration at Keycloak uses the client idp-admin and the password of the customer class only.
      IDP_ADMIN_CLIENT_SECRET_FILE: /run/secrets/idp-admin_client_secret
      IDP_USER_PASSWORD_FILE: /run/secrets/keycloak_password_customer
      # DK-02a: Kong is the one proxy in front; the address it appended to X-Forwarded-For is the client (K-14).
      EDGE_PROXY_HOPS: '1'
    secrets: [api-gateway_client_secret, idp-admin_client_secret, keycloak_password_customer]
    networks: [business]
    depends_on:
      keycloak: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      reconciliation-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  # ---- The edge (DK-02a): Kong 3.9.4 OSS without a database, the only published service ----
  # Before Kong starts, the IdP's public key is read and written into Kong's declarative file (a public key, not a
  # secret). If the dev IdP is recreated it makes a new key: run `up -d --force-recreate kong-config kong` then.
  kong-config:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-gateway:dk01a
    command: ['node', '/app/service/dist/edge/render-main.js']
    environment:
      TZ: UTC
      <<: *idp-env
      KONG_UPSTREAM_URL: http://gateway:4010
      KONG_CONFIG_OUT: /state/kong.json
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      KONG_RATE_LIMIT_PER_MINUTE: ${KONG_RATE_LIMIT_PER_MINUTE:-300}
    volumes: ['kong-config:/state']
    networks: [business]
    depends_on:
      keycloak: { condition: service_healthy }

  kong:
    <<: *hardening
    image: kong:3.9.4@sha256:c1f5fbb80cd666b4b29b4e97875ecd64d93b01b23fb3083bc3e424b3bad5fdd5
    # The image's own user (kong, not root). The prefix (pid, generated nginx config) goes to the tmpfs; /usr/local/kong
    # itself holds libraries of the image and is read-only.
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      KONG_DATABASE: 'off'
      KONG_PREFIX: /tmp/kong
      KONG_DECLARATIVE_CONFIG: /declarative/kong.json
      # TLS only: there is no plain HTTP listener (NFR-06). The admin API is off; the status listener (with /metrics for
      # Prometheus) is on the internal network and is not published.
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 'off'
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_SSL_CERT: /run/secrets/tls_kong_crt
      KONG_SSL_CERT_KEY: /run/secrets/tls_kong_key
      KONG_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      # Only what DK-02a uses is loaded.
      KONG_PLUGINS: jwt,rate-limiting,request-size-limiting,request-termination,correlation-id,post-function,prometheus,privacy-tokenizer
      # DK-02b: the plugin code is mounted read-only from the repository, not built into an image.
      KONG_LUA_PACKAGE_PATH: /plugins/?.lua;;
      # The whole body (settlement, up to the 64 KiB limit) stays in memory, so the plugin can read it.
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 128k
      KONG_NGINX_WORKER_PROCESSES: '1'
      # No access log: request lines and addresses stay out of the logs (invariant 6); errors go to stderr.
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      # No version or latency headers on answers.
      KONG_HEADERS: 'off'
      KONG_ERROR_DEFAULT_TYPE: application/json
    secrets: [tls_kong_crt, tls_kong_key]
    volumes:
      - 'kong-config:/declarative:ro'
      - '../../services/gateway/plugins/privacy-tokenizer/kong:/plugins/kong:ro'
    networks: [edge, business]
    healthcheck:
      test: [CMD, kong, health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      kong-config: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }

  # ---- Keycloak (DK-04, ADR-0017): the IdP of the stack, in both conditions ----
  # The realm is rendered first, from secret files. There is no bootstrap administrator: nobody can sign in to the console,
  # and the realm is managed by the client `idp-admin` only. The realm is imported again whenever the container is made again
  # (H2 lives in the container), and an import makes new signing keys: recreate `gateway`, `kong-config` and `kong` with it
  # (`up -d --force-recreate keycloak gateway kong-config kong`; Kong reads the key only when `kong-config` runs).
  keycloak-realm:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-gateway:dk01a
    build: *build-gateway-image
    command: ['node', '/render/keycloak-realm.cjs', '/run/secrets', '/state/privpay-realm.json']
    secrets:
      [api-gateway_client_secret, transaction_client_secret, fraud_client_secret, notification_client_secret, reconciliation_client_secret, idp-admin_client_secret, admin-console_client_secret, keycloak_password_customer, keycloak_password_admin, keycloak_password_auditor, keycloak_password_analyst, keycloak_password_bank]
    volumes:
      - 'keycloak-import:/state'
      - '../../scripts/docker/keycloak-realm.cjs:/render/keycloak-realm.cjs:ro'
    networks: [business]

  keycloak:
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Not read-only: `start-dev` builds its runtime (lib/quarkus) and keeps an H2 file at start. The user is the image's own (keycloak).
    restart: unless-stopped
    tmpfs: ['/tmp']
    image: quay.io/keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd
    command: ['start-dev', '--import-realm']
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
    environment:
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      # DK-04c: never debug. The registration searches users by a candidate customer_id in the query of the Admin API; at info
      # the server does not write request lines, and a test (keycloak-claims) reads the log after such a search.
      KC_LOG_LEVEL: info
      # The JVM heap is capped so the container stays within its limit (the rest is metaspace, threads and native memory).
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx320m
    volumes: ['keycloak-import:/opt/keycloak/data/import:ro']
    networks: [business]
    healthcheck:
      # The image has no curl and /bin/sh has no /dev/tcp; bash opens the management port and asks for readiness.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      keycloak-realm: { condition: service_completed_successfully }

  # ---- One-off check from inside the network (`pnpm docker:smoke`): the IdP and the SMS simulator are not published. ----
  smoke:
    <<: [*hardening, *limits]
    restart: 'no'
    profiles: [smoke]
    image: privpay-gateway:dk01a
    working_dir: /smoke
    command: [node, /smoke/smoke.cjs]
    environment:
      TZ: UTC
      GATEWAY_URL: http://gateway:4010
      IDP_URL: http://keycloak:8080
      IDP_KIND: keycloak
      IDP_REALM: privpay
      IDP_USER_PASSWORD_FILE: /run/secrets/keycloak_password_customer
      IDP_ANALYST_PASSWORD_FILE: /run/secrets/keycloak_password_analyst
      IDP_ADMIN_CONSOLE_SECRET_FILE: /run/secrets/admin-console_client_secret
      SMS_URL: http://sms-simulator:4007
    secrets: [keycloak_password_customer, keycloak_password_analyst, admin-console_client_secret]
    volumes: ['../../scripts/docker/smoke.cjs:/smoke/smoke.cjs:ro']
    networks: [business]
    depends_on:
      gateway: { condition: service_healthy }
