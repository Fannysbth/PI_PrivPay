# PrivPay, Docker Compose (DK-01a). This file holds everything the two conditions share; the condition itself is chosen by
# the second file: `-f docker-compose.yml -f mode.proposed.yml` or `-f docker-compose.yml -f mode.baseline.yml` (ADR-0003;
# `pnpm docker:up`). Without a mode file the services refuse to start (PRIVACY_MODE is required).
#
# - Services live on an internal network; only the Gateway is published, and only on the loopback of the host (AZ-43, N-05:
#   /health and /metrics of the Gateway stay reachable there until Kong takes the edge, DK-02/DK-03).
# - Same CPU and memory limits in both conditions, because the limits are written here once (Metodologi C.3).
# - Secrets are Docker secrets: files from secrets/docker/ (made by `pnpm docker:secrets`, git-ignored) mounted under
#   /run/secrets and named in <NAME>_FILE variables. No secret is in an image, an argument or an environment value.
# - Monitoring is only defined (docker-compose.monitoring.yml, profile `monitoring`); nothing starts it by default.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true
  tmpfs: ['/tmp']
  restart: unless-stopped

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 192M

x-node-health: &node-health
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s

x-pg: &pg
  image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
  user: postgres
  tmpfs: ['/tmp', '/var/run/postgresql']
  command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - max_connections=50
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=16MB
    - -c
    - log_statement=none
  # TCP, not the socket: the temporary server of the first start only listens on the socket, so a socket check would pass
  # before the init script has made the roles.
  healthcheck:
    test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

x-node-env: &node-env
  TZ: UTC
  BIND_HOST: 0.0.0.0
  IDP_URL: http://idp:4000

networks:
  internal:
    internal: true
  edge: {}

secrets:
  pseudonym_hmac_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pseudonym_hmac_secret' }
  blind_index_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/blind_index_secret' }
  field_encryption_key: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/field_encryption_key' }
  api-gateway_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/api-gateway_client_secret' }
  transaction_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/transaction_client_secret' }
  fraud_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/fraud_client_secret' }
  notification_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/notification_client_secret' }
  reconciliation_client_secret: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/reconciliation_client_secret' }
  privpay_privacy_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_privacy_owner_password' }
  privpay_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_app_password' }
  privpay_auditor_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_auditor_password' }
  privpay_transaction_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_transaction_owner_password' }
  privpay_transaction_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_transaction_app_password' }
  privpay_fraud_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_fraud_owner_password' }
  privpay_fraud_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_fraud_app_password' }
  privpay_notification_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_notification_owner_password' }
  privpay_notification_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_notification_app_password' }
  privpay_reconciliation_owner_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_reconciliation_owner_password' }
  privpay_reconciliation_app_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/privpay_reconciliation_app_password' }
  pg_privacy_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_privacy_admin_password' }
  pg_transaction_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_transaction_admin_password' }
  pg_fraud_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_fraud_admin_password' }
  pg_notification_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_notification_admin_password' }
  pg_reconciliation_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/pg_reconciliation_admin_password' }
  grafana_admin_password: { file: '${PRIVPAY_SECRETS_DIR:-../../secrets/docker}/grafana_admin_password' }

volumes:
  idp-state: {}
  pgdata-privacy: {}
  pgdata-transaction: {}
  pgdata-fraud: {}
  pgdata-notification: {}
  pgdata-reconciliation: {}

services:
  # ---- PostgreSQL 16, one instance per service (invariant 4). pg-privacy is added by mode.proposed.yml. ----
  pg-transaction:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_transaction_admin_password
      PRIVPAY_DB: privpay_transaction
      PRIVPAY_OWNER: privpay_transaction_owner
      PRIVPAY_APP: privpay_transaction_app
    volumes:
      - pgdata-transaction:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_transaction_admin_password, privpay_transaction_owner_password, privpay_transaction_app_password]
    networks: [internal]

  pg-fraud:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_fraud_admin_password
      PRIVPAY_DB: privpay_fraud
      PRIVPAY_OWNER: privpay_fraud_owner
      PRIVPAY_APP: privpay_fraud_app
    volumes:
      - pgdata-fraud:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_fraud_admin_password, privpay_fraud_owner_password, privpay_fraud_app_password]
    networks: [internal]

  pg-notification:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_notification_admin_password
      PRIVPAY_DB: privpay_notification
      PRIVPAY_OWNER: privpay_notification_owner
      PRIVPAY_APP: privpay_notification_app
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_notification_admin_password, privpay_notification_owner_password, privpay_notification_app_password]
    networks: [internal]

  pg-reconciliation:
    <<: [*pg, *hardening, *limits]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_reconciliation_admin_password
      PRIVPAY_DB: privpay_reconciliation
      PRIVPAY_OWNER: privpay_reconciliation_owner
      PRIVPAY_APP: privpay_reconciliation_app
    volumes:
      - pgdata-reconciliation:/var/lib/postgresql/data
      - ../postgres/init-service-db.sh:/docker-entrypoint-initdb.d/10-init-service-db.sh:ro
    secrets: [pg_reconciliation_admin_password, privpay_reconciliation_owner_password, privpay_reconciliation_app_password]
    networks: [internal]

  # ---- Migrations, run once per database by its schema owner (the runtime role never sees the owner password). ----
  migrate-transaction:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-transaction-service:dk01a
    build: &build-transaction
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/transaction-service', SERVICE_DIR: services/transaction-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, transaction]
    environment: { TZ: UTC, PG_HOST: pg-transaction, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_transaction_owner_password]
    networks: [internal]
    depends_on: { pg-transaction: { condition: service_healthy } }

  migrate-fraud:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-fraud-service:dk01a
    build: &build-fraud
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/fraud-service', SERVICE_DIR: services/fraud-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, fraud]
    environment: { TZ: UTC, PG_HOST: pg-fraud, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_fraud_owner_password]
    networks: [internal]
    depends_on: { pg-fraud: { condition: service_healthy } }

  migrate-notification:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-notification-service:dk01a
    build: &build-notification
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/notification-service', SERVICE_DIR: services/notification-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, notification]
    environment: { TZ: UTC, PG_HOST: pg-notification, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_notification_owner_password]
    networks: [internal]
    depends_on: { pg-notification: { condition: service_healthy } }

  migrate-reconciliation:
    <<: [*hardening, *limits]
    restart: 'no'
    image: privpay-reconciliation-service:dk01a
    build: &build-reconciliation
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/reconciliation-service', SERVICE_DIR: services/reconciliation-service }
    working_dir: /app
    command: [node, /app/service/node_modules/@privpay/common/dist/bin/db-migrate.js, reconciliation]
    environment: { TZ: UTC, PG_HOST: pg-reconciliation, PG_PORT: '5432', PG_SECRETS_DIR: /run/secrets }
    secrets: [privpay_reconciliation_owner_password]
    networks: [internal]
    depends_on: { pg-reconciliation: { condition: service_healthy } }

  # ---- The identity provider of the dev phase (Keycloak replaces it in DK-04). Internal only. ----
  idp:
    <<: [*hardening, *limits, *node-health]
    image: privpay-idp:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/dev-idp', SERVICE_DIR: tools/dev-idp }
    environment:
      <<: *node-env
      PORT: '4000'
      NODE_ENV: development
      DEV_IDP_ENABLED: 'true'
      DEV_IDP_SECRETS_DIR: /run/secrets
      DEV_IDP_STATE_DIR: /state
    volumes: ['idp-state:/state']
    secrets: [api-gateway_client_secret, transaction_client_secret, fraud_client_secret, notification_client_secret, reconciliation_client_secret]
    networks: [internal]

  # ---- Business services ----
  transaction-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-transaction-service:dk01a
    build: *build-transaction
    environment:
      <<: *node-env
      PORT: '4002'
      PG_HOST: pg-transaction
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      FRAUD_AMOUNT_THRESHOLD: '1000000'
      TX_PENDING_TIMEOUT_SECONDS: '300'
      TX_SWEEP_INTERVAL_SECONDS: '30'
      FRAUD_SERVICE_URL: http://fraud-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      TRANSACTION_CLIENT_SECRET_FILE: /run/secrets/transaction_client_secret
    secrets: [privpay_transaction_app_password, transaction_client_secret]
    networks: [internal]
    depends_on:
      migrate-transaction: { condition: service_completed_successfully }
      idp: { condition: service_healthy }

  fraud-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-fraud-service:dk01a
    build: *build-fraud
    environment:
      <<: *node-env
      PORT: '4003'
      PG_HOST: pg-fraud
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      FRAUD_AMOUNT_THRESHOLD: '1000000'
      FRAUD_ODD_HOUR_START: '22'
      FRAUD_ODD_HOUR_END: '6'
      FRAUD_HOLD_THRESHOLD: '50'
      FRAUD_BLOCK_THRESHOLD: '90'
      FRAUD_HISTORY_DAYS: '30'
    secrets: [privpay_fraud_app_password]
    networks: [internal]
    depends_on:
      migrate-fraud: { condition: service_completed_successfully }
      idp: { condition: service_healthy }

  notification-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-notification-service:dk01a
    build: *build-notification
    environment:
      <<: *node-env
      PORT: '4004'
      PG_HOST: pg-notification
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      SMS_SIMULATOR_URL: http://sms-simulator:4007
      NOTIFICATION_CLIENT_SECRET_FILE: /run/secrets/notification_client_secret
    secrets: [privpay_notification_app_password, notification_client_secret]
    networks: [internal]
    depends_on:
      migrate-notification: { condition: service_completed_successfully }
      idp: { condition: service_healthy }

  reconciliation-service:
    <<: [*hardening, *limits, *node-health]
    image: privpay-reconciliation-service:dk01a
    build: *build-reconciliation
    environment:
      <<: *node-env
      PORT: '4005'
      PG_HOST: pg-reconciliation
      PG_PORT: '5432'
      PG_SECRETS_DIR: /run/secrets
      RECON_DAILY_RUN_UTC: '00:10'
      TRANSACTION_SERVICE_URL: http://transaction-service:4002
      RECONCILIATION_CLIENT_SECRET_FILE: /run/secrets/reconciliation_client_secret
    secrets: [privpay_reconciliation_app_password, reconciliation_client_secret]
    networks: [internal]
    depends_on:
      migrate-reconciliation: { condition: service_completed_successfully }
      idp: { condition: service_healthy }

  # ---- Simulators ----
  sms-simulator:
    <<: [*hardening, *limits, *node-health]
    image: privpay-sms-simulator:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/sms-simulator', SERVICE_DIR: services/sms-simulator }
    environment:
      <<: *node-env
      PORT: '4007'
      SMS_SIMULATOR_TEST_ENDPOINTS: 'true'
    networks: [internal]

  bank-simulator:
    <<: [*hardening, *limits, *node-health]
    image: privpay-bank-simulator:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/bank-simulator', SERVICE_DIR: services/bank-simulator }
    environment:
      <<: *node-env
      PORT: '4006'
      GATEWAY_URL: http://gateway:4010
      BANK_USERNAME: bank.uji.1
      BANK_SIMULATOR_TEST_ENDPOINTS: 'true'
    networks: [internal]

  # ---- The only published service ----
  gateway:
    <<: [*hardening, *limits, *node-health]
    image: privpay-gateway:dk01a
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args: { SERVICE_PKG: '@privpay/gateway', SERVICE_DIR: services/gateway }
    environment:
      <<: *node-env
      PORT: '4010'
      TRANSACTION_SERVICE_URL: http://transaction-service:4002
      RECONCILIATION_SERVICE_URL: http://reconciliation-service:4005
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      API_GATEWAY_CLIENT_SECRET_FILE: /run/secrets/api-gateway_client_secret
    secrets: [api-gateway_client_secret]
    networks: [internal, edge]
    depends_on:
      idp: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      reconciliation-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  # ---- One-off check from inside the network (`pnpm docker:smoke`): the IdP and the SMS simulator are not published. ----
  smoke:
    <<: [*hardening, *limits]
    restart: 'no'
    profiles: [smoke]
    image: privpay-gateway:dk01a
    working_dir: /smoke
    command: [node, /smoke/smoke.cjs]
    environment:
      TZ: UTC
      GATEWAY_URL: http://gateway:4010
      IDP_URL: http://idp:4000
      SMS_URL: http://sms-simulator:4007
    volumes: ['../../scripts/docker/smoke.cjs:/smoke/smoke.cjs:ro']
    networks: [internal]
    depends_on:
      gateway: { condition: service_healthy }
