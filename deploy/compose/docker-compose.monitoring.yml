# Monitoring for M7 (NFR-18): Prometheus, Grafana and cAdvisor. Every service is in the profile `monitoring`, so nothing here
# starts with `up` unless `--profile monitoring` is given. Needs PRIVPAY_MODE=<proposed|baseline> (it picks the Prometheus file;
# `pnpm docker:compose` sets it). Start with:
#   pnpm docker:compose <mode> -f deploy/compose/docker-compose.monitoring.yml --profile monitoring up -d --wait
# Only Grafana is published, and only on the loopback of the host. Images are pinned by digest; no secret is written here
# (the Grafana administrator password is a Docker secret read from a file).
# Memory limits are the same in both conditions. cAdvisor reads the cgroups of the host through read-only mounts; it keeps only
# CPU and memory (the two metrics of Metodologi Tabel V) to stay small. v0.55.1, not v0.52.1: on Docker Desktop (containerd image
# store) v0.52.1 fails with "failed to identify the read-write layer ID" and reports no container at all (found in M7-A).

services:
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }
    volumes:
      - ../prometheus/prometheus.${PRIVPAY_MODE:?set PRIVPAY_MODE to proposed or baseline}.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # It scrapes the business zone and, in the proposed condition, the Privacy Service over TLS (job `privpay-privacy`).
    secrets: [tls_ca_crt]
    networks: [business, privacy]

  cadvisor:
    profiles: [monitoring]
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuLoad,memory_numa,percpu,sched,tcp,udp,process,hugetlb,referenced_memory,resctrl,disk,diskIO,network,oom_event
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }
    # cAdvisor cannot run read-only with all capabilities dropped (it reads /sys and the Docker socket); these mounts are all it has.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [business]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets: [grafana_admin_password]
    ports: ['127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [business, edge]

volumes:
  prometheus-data: {}
  grafana-data: {}
