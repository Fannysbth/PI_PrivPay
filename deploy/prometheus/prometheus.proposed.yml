# Prometheus scrape configuration, PROPOSED condition. Chosen by docker-compose.monitoring.yml from PRIVPAY_MODE; the
# baseline condition uses prometheus.baseline.yml, which leaves out the Privacy Service (there is no such service in baseline).
# /metrics of every service listens on the service port inside the internal network.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: privpay
    metrics_path: /metrics
    static_configs:
      - targets:
          - transaction-service:4002
          - fraud-service:4003
          - notification-service:4004
          - reconciliation-service:4005
          - bank-simulator:4006
          - sms-simulator:4007
          - gateway:4010
  # The Privacy Service serves TLS (DK-03): the scrape verifies its certificate against the dev CA like any caller.
  - job_name: privpay-privacy
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/tls_ca_crt
    static_configs:
      - targets: ['privacy-service:4001']
  # NFR-18: CPU and memory of every container (Metodologi Tabel V). A shorter interval than the services: a rate needs samples.
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
